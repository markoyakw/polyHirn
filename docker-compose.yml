services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    # env_file:
    #   - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
